---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure-task-manager
  labels:
    app: secure-task-manager
    tier: frontend
    app.kubernetes.io/part-of: secure-task-management-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: secure-task-manager
      tier: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: secure-task-manager
        tier: frontend
    spec:
      containers:
        - name: web
          image: secure-task-manager:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: secure-task-secrets
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: secure-task-secrets
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: secure-task-secrets
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: secure-task-secrets
                  key: DB_USER
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: secure-task-secrets
                  key: DB_PASS
          readinessProbe:
            httpGet:
              path: /index.php
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /index.php
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 400m
              memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: secure-task-manager
  labels:
    app: secure-task-manager
    tier: frontend
spec:
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app: secure-task-manager
    tier: frontend
